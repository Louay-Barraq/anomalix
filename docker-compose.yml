services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: maghrebia-sqlserver
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Maghrebia@2025"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - maghrebia-sqlserver-data:/var/opt/mssql

volumes:
  maghrebia-sqlserver-data: