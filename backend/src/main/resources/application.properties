spring.application.name=anomalix-backend

# Connexion SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MaghrebiaAnomalyDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Maghrebia@2025
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# CORS
spring.web.cors.allowed-origins=*

# Scheduler
# Fréquence de détection en ms (ici 30 minutes)
# anomalix.scheduler.rate=1800000

# Port du serveur
server.port=8080